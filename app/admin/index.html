<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>artesaná. painel</title>
  <link rel="icon" href="../../assets/brand/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,100&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Poppins', system-ui, sans-serif; font-size: 14px; color: var(--ink); background: var(--cream); }
    a { color: var(--moss-d); }
    h1, h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-variation-settings: 'SOFT' 100; margin: 0; }
    h1 { font-size: 26px; }
    h2 { font-size: 19px; margin: 26px 0 10px; }
    .topo { display: flex; align-items: center; gap: 16px; padding: 14px 22px; background: var(--moss-d); color: var(--cream); flex-wrap: wrap; }
    .topo h1 { color: var(--cream); }
    .topo h1 b { color: var(--peach); }
    .topo nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
    .topo nav button { background: transparent; border: 0; color: var(--cream); opacity: 0.8; padding: 8px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
    .topo nav button.on, .topo nav button:hover { background: rgba(255, 245, 239, 0.14); opacity: 1; font-weight: 600; }
    main { padding: 18px 22px 60px; max-width: 1240px; margin: 0 auto; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .card { background: var(--white); border-radius: 14px; padding: 12px 14px; box-shadow: 0 2px 10px rgba(44, 26, 30, 0.06); }
    .card .n { font-family: 'Fraunces', Georgia, serif; font-size: 30px; line-height: 1; }
    .card .l { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
    .duas { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: 12px; overflow: hidden; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: var(--peach-l); font-weight: 600; }
    tr:hover td { background: #fffaf6; }
    .barras { display: grid; gap: 4px; }
    .barra { display: grid; grid-template-columns: 150px 1fr 40px; gap: 8px; align-items: center; font-size: 12.5px; }
    .barra i { display: block; height: 12px; border-radius: 6px; background: var(--moss); min-width: 2px; }
    .barra small { text-align: right; color: var(--ink-2); }
    .dias { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding: 6px 0; }
    .dias div { flex: 1; background: var(--peach); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
    .dias div:hover { background: var(--peach-d); }
    .dias div span { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-size: 10px; white-space: nowrap; opacity: 0; }
    .dias div:hover span { opacity: 1; }
    pre { white-space: pre-wrap; font: inherit; margin: 0; background: var(--cream); padding: 8px 10px; border-radius: 8px; font-size: 12.5px; }
    .login { max-width: 360px; margin: 60px auto; display: grid; gap: 10px; }
    input, textarea, button.btn { font: inherit; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--white); }
    .btn { background: var(--moss); color: var(--cream); border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
    .btn.claro { background: var(--white); color: var(--ink); border: 1.5px solid var(--line); }
    .btn.sm { padding: 6px 10px; font-size: 12.5px; }
    .erro { color: var(--erro); font-size: 13px; }
    .conversa { background: var(--white); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
    .conversa header { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; margin-bottom: 8px; }
    .msgs { display: grid; gap: 6px; margin: 8px 0; }
    .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 13.5px; }
    .msg.cliente { background: var(--cream); justify-self: start; }
    .msg.equipe { background: var(--moss); color: var(--cream); justify-self: end; }
    .msg small { display: block; opacity: 0.7; font-size: 10.5px; margin-top: 2px; }
    .responder { display: flex; gap: 8px; }
    .responder textarea { min-height: 44px; }
    .aviso { background: var(--peach-l); padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; }
    .nota { color: var(--ink-2); font-size: 12.5px; }
    .tabela-rolavel { overflow-x: auto; }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--peach-l); font-size: 11.5px; }
    .tag.ok { background: #DDE9D9; }
  </style>
</head>
<body>
  <div class="topo">
    <h1>artesaná<b>.</b> painel</h1>
    <nav id="abas" class="hidden"></nav>
  </div>
  <main id="tela"></main>
  <script type="module" src="./admin.js"></script>
</body>
</html>
